<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tablero de investigación SGEE</title>
<meta name="description" content="Avance de la aplicación de instrumentos y mapa de coherencia de la investigación sobre el Sistema de Gestión de Expedientes Electrónicos del Hospital Militar de Honduras.">
<style>html,body{margin:0;background:#0e1a2b;color:#f2ede3;font:15px system-ui,sans-serif}p{padding:40px 20px;text-align:center;opacity:.7}a{color:#e0b65a}</style>
</head>
<body>
<p id="msg">Cargando el tablero…</p>
<script>
// Enlace fijo: esta página no cambia; siempre trae la versión más reciente del tablero (sitio.html) sin usar la copia guardada del navegador.
fetch("sitio.html?t="+Date.now(),{cache:"no-store"})
  .then(r=>{if(!r.ok) throw new Error(r.status); return r.text();})
  .then(html=>{document.open();document.write(html);document.close();})
  .catch(()=>{document.getElementById("msg").innerHTML='No se pudo cargar el tablero. <a href="sitio.html">Abrir directamente</a>.';});
</script>
</body>
</html>
